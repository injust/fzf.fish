version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "actions/checkout"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "fish-shop/*"
        update-types:
          - "version-update:semver-major"
    groups:
      fish-shop:
        patterns:
          - fish-shop/*
